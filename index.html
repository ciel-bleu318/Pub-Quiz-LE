<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>Nebula Nighthawks — Pub Quiz</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Global atmosphere: drifting smoke, film grain, scanlines, vignette -->
    <div id="atmosphere" aria-hidden="true">
        <div class="atmo-fog">
            <span class="wisp w1"></span>
            <span class="wisp w2"></span>
            <span class="wisp w3"></span>
            <span class="wisp w4"></span>
            <span class="wisp w5"></span>
        </div>
        <div class="atmo-grain"></div>
        <div class="atmo-scanlines"></div>
        <div class="atmo-vignette"></div>
    </div>

    <div id="app">
        <!-- Header -->
        <header id="app-header">
            <div class="logo-block">
                <div class="logo-emblem" id="header-logo">
                    <svg class="hawk-icon" viewBox="0 0 120 70" aria-hidden="true">
                        <path fill="currentColor" d="M5,46 L36,20 L48,30 L60,10 L72,30 L84,20 L115,46 L88,38 L68,64 L60,52 L52,64 L32,38 Z"/>
                    </svg>
                </div>
                <div class="logo-text-block">
                    <span class="logo-name-wrap">
                        <span class="logo-name">Nebula Nighthawks</span>
                        <svg class="smoke-stream" viewBox="0 0 40 100" width="26" height="64" aria-hidden="true">
                            <defs>
                                <linearGradient id="smokeFade" x1="0" y1="1" x2="0" y2="0">
                                    <stop offset="0%" stop-color="currentColor" stop-opacity="0.9"/>
                                    <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
                                </linearGradient>
                            </defs>
                            <path class="stream s1" d="M20,96 C6,80 34,64 16,46 C0,30 28,16 18,0" stroke="url(#smokeFade)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
                            <path class="stream s2" d="M14,96 C28,82 4,62 22,44 C34,28 10,14 20,0" stroke="url(#smokeFade)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
                            <path class="stream s3" d="M24,96 C10,78 30,58 12,40 C-2,24 22,8 14,0" stroke="url(#smokeFade)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
                        </svg>
                    </span>
                    <span class="logo-tagline">Midnight Lounge of the Outer Rim</span>
                </div>
            </div>
            <nav id="main-nav">
                <button class="nav-btn" data-screen="setup">SETUP</button>
                <button class="nav-btn" data-screen="main">SPIEL</button>
                <button class="nav-btn" id="reset-progress-btn" title="Punkte und gespielte Fragen zurücksetzen — Teams, Kategorien, Fragen und Medien bleiben erhalten">NEUE RUNDE</button>
                <button class="nav-btn danger" id="reset-btn" title="Kompletten Spielstand inkl. Teams, Kategorien, Fragen und Medien löschen">ALLES LÖSCHEN</button>
            </nav>
        </header>

        <!-- Screens -->
        <main id="screen-container">
            <section id="screen-setup" class="screen"></section>
            <section id="screen-main" class="screen hidden"></section>
            <section id="screen-question" class="screen hidden"></section>
        </main>

        <footer id="app-footer">
            <span class="footer-coord">// COORD 47.21°N · 8.54°E</span>
            <span class="footer-status" id="footer-status">SYSTEM BEREIT</span>
            <span class="footer-coord">// OUTER RIM · LOCAL CACHE</span>
        </footer>
    </div>

    <!-- Templates -->
    <template id="tpl-setup">
        <div class="setup-grid">
            <div class="panel panel-wide" id="panel-logo">
                <h2 class="panel-title">// IDENTITÄT</h2>
                <p class="panel-hint">Optionales eigenes Logo — ersetzt das Emblem oben links im Header.</p>
                <div class="logo-control" id="logo-control"></div>
            </div>

            <div class="panel" id="panel-avatars">
                <h2 class="panel-title">// AVATAR-POOL</h2>
                <p class="panel-hint">Lade ~15 Bilder hoch. Teams wählen daraus ihren Avatar.</p>
                <div class="upload-zone" id="avatar-upload">
                    <input type="file" id="avatar-file-input" multiple accept="image/*" hidden>
                    <span class="upload-icon">+</span>
                    <span>Bilder hierher ziehen oder klicken</span>
                </div>
                <div class="avatar-pool" id="avatar-pool"></div>
            </div>

            <div class="panel" id="panel-teams">
                <h2 class="panel-title">// TEAMS</h2>
                <p class="panel-hint">4–6 Teams. Klicke einen Avatar im Pool, um ihn zuzuweisen.</p>
                <div class="teams-list" id="teams-list"></div>
                <button class="btn btn-secondary" id="add-team-btn">+ Team hinzufügen</button>
            </div>

            <div class="panel panel-wide" id="panel-categories">
                <h2 class="panel-title">// KATEGORIEN &amp; FRAGEN</h2>
                <div class="categories-list" id="categories-list"></div>
                <button class="btn btn-secondary" id="add-category-btn">+ Kategorie hinzufügen</button>
            </div>

            <div class="panel panel-wide" id="panel-actions">
                <button class="btn btn-primary big" id="start-game-btn">SPIEL STARTEN ▸</button>
                <label class="toggle" id="progress-toggle-wrap">
                    <input type="checkbox" id="progress-toggle">
                    <span class="toggle-track"><span class="toggle-dot"></span></span>
                    <span class="toggle-label">FORTSCHRITTSBALKEN ANZEIGEN</span>
                </label>
                <span class="status-line" id="setup-status"></span>
            </div>
        </div>
    </template>

    <template id="tpl-main"></template>
    <template id="tpl-question"></template>

    <!-- Modal Container -->
    <div id="modal-root" class="modal-root hidden"></div>

    <!-- JS Modules -->
    <script src="js/MediaCache.js"></script>
    <script src="js/GameState.js"></script>
    <script src="js/SetupManager.js"></script>
    <script src="js/MainBoard.js"></script>
    <script src="js/QuestionRenderer.js"></script>
    <script src="js/UIController.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
